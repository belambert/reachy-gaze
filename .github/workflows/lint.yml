name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.13
      - run: uv pip install black isort
      - run: uv run black --check gaze_tracker tests
      - run: uv run isort --check-only gaze_tracker tests
