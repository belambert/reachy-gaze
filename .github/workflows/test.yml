name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The control loop's tests import the app, so the robot SDK has to import
      # too: PyGObject builds against cairo and girepository, and the SDK asks
      # gi for the GStreamer typelibs at import time.
      - run: sudo apt-get update
      - run: >
          sudo apt-get install -y libcairo2-dev libgirepository1.0-dev
          gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - run: uv sync --extra dev
      - run: uv run pytest tests -q
      # The control panel's state sync has races that only show up under
      # out-of-order responses; these drive it against a stubbed DOM.
      - run: node tests/test_panel.mjs
