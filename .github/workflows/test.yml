name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.13
      # The robot SDK needs GStreamer/PyGObject on Linux, which needs cairo to
      # build. The tested modules never import it, so install what they touch and
      # keep uv from syncing the project on top of that.
      - run: uv pip install numpy scipy pillow requests pytest
      - run: uv run --no-project pytest tests -q
      # The control panel's state sync has races that only show up under
      # out-of-order responses; these drive it against a stubbed DOM.
      - run: node tests/test_panel.mjs
