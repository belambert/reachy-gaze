[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "reachy_gaze"
version = "0.1.0"
description = "Make Reachy Mini look at people and pets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    # imported directly (main.py, detector.py), so declared rather than leaned
    # on the SDK to provide -- CI's SDK resolves without scipy.
    "numpy",
    "scipy",
    "pydantic",
    "pillow", # the robot has no JPEG encoder; opencv is an optional extra
    "tritonclient[grpc]", # talks to the vision-server ensemble over gRPC
    "requests", # the built-in-server backend speaks HTTP
]
keywords = ["reachy-mini-app"]

[project.optional-dependencies]
# Only needed on the machine that runs detection, not on the robot.
server = [
    "fastapi",
    "torch",
    "typer",
    "ultralytics",
    "uvicorn",
]
dev = [
    "black",
    "isort",
    "mypy",
    "pytest",
]

[project.entry-points."reachy_mini_apps"]
reachy_gaze = "reachy_gaze.main:ReachyGaze"

[project.scripts]
reachy-gaze-server = "reachy_gaze.server.app:cli"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
reachy_gaze = ["**/*"] # Also include all non-.py files

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py310"]
