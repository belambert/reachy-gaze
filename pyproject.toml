[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "tracker"
version = "0.1.0"
description = "Point Reachy Mini's head at a named object — a person, a cat, a dog"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "pillow",  # the robot has no JPEG encoder; opencv is an optional extra
]
keywords = ["reachy-mini-app"]

[project.optional-dependencies]
# Only needed on the machine that runs detection, not on the robot.
server = [
    "fastapi",
    "torch",
    "typer",
    "ultralytics",
    "uvicorn",
]
dev = [
    "black",
    "isort",
    "mypy",
    "pytest",
]

[project.entry-points."reachy_mini_apps"]
tracker = "tracker.main:Tracker"

[project.scripts]
tracker-server = "tracker.server.app:cli"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
tracker = ["**/*"] # Also include all non-.py files

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py310"]
