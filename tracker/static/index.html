<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>Tracker</h1>

    <section class="card">
        <label class="row">
            <span>Track</span>
            <select id="label"></select>
        </label>

        <label class="row">
            <span>Confidence</span>
            <input type="range" id="conf" min="0.1" max="0.9" step="0.05">
            <output id="conf-value"></output>
        </label>

        <label class="row toggle">
            <input type="checkbox" id="enabled">
            <span>Tracking enabled</span>
        </label>

        <label class="row toggle">
            <input type="checkbox" id="scan">
            <span>Sweep when target is lost</span>
        </label>
    </section>

    <section class="card">
        <div class="row">
            <span>Detector</span>
            <input type="text" id="server-url" placeholder="http://192.168.1.10:8100">
            <button id="apply-url">Apply</button>
        </div>
        <p class="hint">Run <code>tracker-server</code> on that machine.</p>
    </section>

    <section class="card status">
        <div class="badges">
            <span class="badge" id="badge-detector">detector</span>
            <span class="badge" id="badge-lock">lock</span>
            <span class="badge" id="badge-fps">&ndash; fps</span>
        </div>
        <div class="view" id="view">
            <div class="crosshair"></div>
            <div class="marker" id="marker"></div>
        </div>
        <p class="error" id="error"></p>
    </section>

    <script src="/static/main.js"></script>
</body>

</html>
