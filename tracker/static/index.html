<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>Tracker</h1>

    <section class="card controls">
        <label class="row">
            <span>Confidence</span>
            <input type="range" id="conf" min="0.1" max="0.9" step="0.05">
            <output id="conf-value"></output>
        </label>

        <label class="row">
            <span>Response</span>
            <input type="range" id="pull" min="4" max="60" step="1">
            <output id="pull-value"></output>
        </label>

        <div class="row toggles">
            <label class="toggle">
                <input type="checkbox" id="enabled" checked>
                <span>Tracking</span>
            </label>
            <label class="toggle">
                <input type="checkbox" id="scan" checked>
                <span>Scan when lost</span>
            </label>
        </div>

        <label class="row">
            <span>Backend</span>
            <select id="backend"></select>
        </label>

        <div class="row">
            <span>Detector</span>
            <input type="text" id="server-url" placeholder="spark-10cf:8101">
            <button id="apply-url">Apply</button>
        </div>

        <p class="hint">
            Looking for <span id="labels"></span>. Lower response is smoother, laggier.
        </p>
    </section>

    <section class="card status">
        <div class="badges">
            <span class="badge" id="badge-detector">detector</span>
            <span class="badge" id="badge-lock">lock</span>
            <span class="badge" id="badge-fps">&ndash; fps</span>
        </div>
        <div class="view" id="view">
            <div class="crosshair"></div>
            <div class="targets" id="targets"></div>
            <div class="marker" id="marker"></div>
        </div>
        <p class="hint aim" id="aim"></p>
        <p class="error" id="error"></p>
    </section>

    <script src="/static/main.js"></script>
</body>

</html>
